name: build

on:
  push:
    branches: [ main, 'vibe/**' ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore SoundFinder.sln
      - name: Build
        run: dotnet build SoundFinder.sln -c Release --no-restore
      - name: Test
        run: dotnet test SoundFinder.sln -c Release --no-build --logger "console;verbosity=normal"
      - name: Restore app with win-x64 RID
        run: dotnet restore src/SoundFinder/SoundFinder.csproj -r win-x64
      - name: Publish Windows app (self-contained)
        run: dotnet publish src/SoundFinder/SoundFinder.csproj -c Release -r win-x64 --self-contained true -o publish --no-restore
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundFinder-win-x64
          path: publish/
          retention-days: 30
